[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octop"
version = "1.0.3b7"
description = "Smarter self-hosted AI assistant for multiple users and agents, built on octop-harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{name = "octop contributors"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.12,<2.14",
    "click>=8.1",
    "rich>=13.7",
    "scalar-fastapi>=1.0",
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]

# Independently installable product applications.
cloud = ["psycopg[binary,pool]>=3.2", "argon2-cffi>=23.1", "cryptography>=41", "pyotp>=2.10.0"]
local-runtime = [
    "octop-harness[all]>=1.0.12",
    "octop-memory>=1.0.6",
    "octop-browser>=1.0.0",
    "python-socks>=2.4",
]

# Development tools for the new product. uv additionally runs retained module regressions.


dev = [
    "octop[local-runtime,cloud]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]

[dependency-groups]
# Dependencies used only by retained legacy-module regression tests.
legacy-tests = [
    "langchain-core>=1.4.8",
    "questionary>=2.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "octop-harness[all]>=1.0.12",
    "octop-memory>=1.0.6",
    "lark-oapi>=1.7.3",
    "octop-gateway>=1.0.4",
    "cryptography>=41",
    "edge-tts>=6.1",
    "segno>=1.6",
    "websockets>=13.0",
    "python-socks>=2.4",
    "acme>=5.6.0",
    "josepy>=2.2.0",
    "boto3>=1.40.61",
    "octop-browser>=1.0.0",
    "playwright>=1.40",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.9,<2",
    "pillow>=13.0.0",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0",
    "pypinyin>=0.53",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "ldap3>=2.9.1",
    "firecrawl-anydoc>=0.2.4",
    "tencentcloud-sdk-python>=3.1.166",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
]

# PEP 735 dev group — installed by default on `uv sync`. Mirrors the
# `[project.optional-dependencies].dev` list above.
dev = [
    { include-group = "legacy-tests" },
    "octop[local-runtime,cloud]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]

[project.scripts]
octop = "octop.cli.main:cli"
octop-cloud = "octop.cli.commands.application:cloud"
octop-cloud-init = "octop.cli.commands.application:cloud_init"
octop-local = "octop.cli.commands.application:local"

[tool.hatch.build.targets.wheel]
packages = ["src/octop"]

[tool.hatch.build.targets.sdist]
include = ["/src/octop", "/vendor", "/scripts/build-product.sh", "/scripts/verify_product_install.py", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/AGENTS.md", "/docs/product-applications.md"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.venv", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache"]

[tool.hatch.build]
include = [
    "src/octop/**/*.py",
    "src/octop/**/*.json",
    "src/octop/**/*.md",
    "src/octop/**/*.sql",
    "src/octop/**/*.sh",
    "src/octop/**/*.png",
    "src/octop/dashboard/**/*",
    "src/octop/infra/agents/experts/library/**/*",
    "src/octop/infra/agents/plugins/bundled/**/*",
    "src/octop/infra/agents/subagents/library/**/*",
    "src/octop/infra/agents/subagents/divisions.json",
    "src/octop/infra/control/desktop/scripts/**/*",
]
artifacts = [
    "src/octop/dashboard/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/octop/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/octop"]
exclude = [
    "src/octop/dashboard/",
    "src/octop/infra/agents/experts/library/",
    "src/octop/infra/agents/plugins/bundled/",
    "src/octop/infra/agents/subagents/library/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.auth"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.health"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.setup"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.users"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.agents"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.providers"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.chat"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.channels"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.cron"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.admin"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.app"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.infra.utils.posix_compat"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "octop.infra.utils.subprocess_io_win"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit real LLM / external services (skipped by default)",
    "slow: expensive tests (integration boot, real harness, browser); skipped by make test-fast",
    "postgresql: tests that need a live PostgreSQL (set OCTOP_TEST_DATABASE_URL)",
]
# The project pins a starlette fork (1.3.1) whose TestClient prefers a
# private ``httpx2`` build that is not installable from PyPI. When ``httpx2``
# is absent it falls back to ``httpx`` and emits a non-actionable
# StarletteDeprecationWarning on every ``starlette.testclient`` import. The
# fallback is intentional for this environment, so silence the noise.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Local libraries are the source of truth for development and product builds.
[tool.uv.sources]
octop-harness = { path = "vendor/octop-harness", editable = true }
octop-memory = { path = "vendor/octop-memory", editable = true }
