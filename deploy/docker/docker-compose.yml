# Cloud-only product. Set a strong OCTOP_BOOTSTRAP_PASSWORD for first creation,
# or run `docker compose ... exec octop octop-cloud-init` interactively.
services:
  octop:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: octop:cloud
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${OCTOP_PORT:-8088}:${OCTOP_PORT:-8088}"
    volumes:
      - ${OCTOP_DATA:-~/.octop}:/data/.octop
    environment:
      OCTOP_PORT: ${OCTOP_PORT:-8088}
      OCTOP_CLOUD_DATABASE_URL: ${OCTOP_CLOUD_DATABASE_URL:-}
      OCTOP_DEFAULT_TIMEZONE: ${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
      OCTOP_ADMIN_USERNAME: ${OCTOP_ADMIN_USERNAME:-admin}
      OCTOP_BOOTSTRAP_PASSWORD: ${OCTOP_BOOTSTRAP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "octop health --role cloud --url http://127.0.0.1:$${OCTOP_PORT:-8088}"]
      interval: 30s
      timeout: 10s
      retries: 3
