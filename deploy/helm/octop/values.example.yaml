# Create Secrets using secrets.example.yaml, then install the cloud chart.
replicaCount: 1
image:
  repository: ghcr.io/tencentcloud/octop
  tag: "1.0.3b7"
config:
  timezone: Asia/Shanghai
ingress:
  host: octop.example.com
  tls:
    enabled: true
    secretName: octop-tls
# For a managed database set postgresql.enabled=false and database.host.
postgresql:
  enabled: true
