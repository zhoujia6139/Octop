# Recommended install name is "octop" in the namespace "octop":
#   helm upgrade --install octop deploy/helm/octop -n octop --create-namespace
#
# Create these Secrets first. The chart does not render passwords.
#   octop-admin  username, password     console login; used only on first init
#   octop-pg     url, user, password, database   PostgreSQL connection + bundled instance
#   octop-tls    TLS secret when ingress.tls.enabled (default)
# See README_CN.md "要准备什么" for the full list.

replicaCount: 1

image:
  repository: ghcr.io/tencentcloud/octop
  # Empty uses Chart.appVersion. Use a newly built cloud product image.
  tag: ""
  pullPolicy: IfNotPresent

config:
  timezone: Asia/Shanghai

secrets:
  database: octop-pg
  admin: octop-admin

service:
  port: 8088

ingress:
  enabled: true
  className: nginx
  host: octop.example.com
  tls:
    enabled: true
    secretName: octop-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Cloud state uses ordinary PostgreSQL; no vector extension is required.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

database:
  host: ""
  port: 5432

nameOverride: ""
fullnameOverride: ""
