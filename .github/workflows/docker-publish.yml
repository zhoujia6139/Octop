name: Docker Publish

# Cloud-only image; both native architectures must pass boot before publication.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (e.g. v1.0.2b6). Required when not running on a tag."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    # 拒绝在非 v* ref 上误跑（例如 UI 里对 main 点 Run workflow 且未填 tag）
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ghcr: ${{ steps.image.outputs.ghcr }}
    steps:
      - name: Resolve version from tag ref
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            ref="$DISPATCH_TAG"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected v* tag, got ref=$ref"
              exit 1
              ;;
          esac

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} ${{ matrix.variant }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            variant: cloud
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            variant: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USER != '' && format('{0}/octop', env.DOCKERHUB_USER) || '' }}
            ${{ needs.prepare.outputs.ghcr }}
          # Only the cloud product has an image tag.
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      # load 与 registry 导出不能同时开。先载入本机做启动测试，通过后再 docker push。
      # docker 导出不支持 provenance，这里关掉，避免 --load 失败。
      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          platforms: ${{ matrix.platform }}
          # NODE_MAX_OLD_SPACE_SIZE：Vite chunk 渲染峰值约 2GB，2048 会偶发退出码 134。
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=4096
          tags: |
            octop:ci-${{ matrix.variant }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}-${{ matrix.arch }}

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Report image size
        run: |
          docker image inspect "octop:ci-${{ matrix.variant }}" \
            --format '::notice::cloud ${{ matrix.arch }} {{.Size}} bytes'

      - name: Boot-test image before publish
        env:
          OCTOP_TEST_IMAGE: octop:ci-${{ matrix.variant }}
        run: |
          set -euo pipefail
          uv venv /tmp/octop-docker-test
          uv pip install --python /tmp/octop-docker-test/bin/python pytest pytest-asyncio
          # 启动测试只调 docker。--noconftest 避免加载 integration conftest（需要 httpx / octop）。
          uv run --no-project --python /tmp/octop-docker-test/bin/python --with pytest --with pytest-asyncio pytest \
            tests/integration/test_docker_image_boot.py \
            -q --tb=short --noconftest

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              */*) docker push "$tag" ;;
            esac
          done <<< "$TAGS"

  merge:
    name: Multi-arch manifest
    needs: [prepare, build]
    # Require both native architecture builds and boot checks.
    if: success()
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VER: ${{ needs.prepare.outputs.version }}
          GHCR: ${{ needs.prepare.outputs.ghcr }}
          HUB: ${{ env.DOCKERHUB_USER != '' && format('{0}/octop', env.DOCKERHUB_USER) || '' }}
        run: |
          set -euo pipefail
          for reg in "$GHCR" "$HUB"; do
            [ -n "$reg" ] || continue
            docker buildx imagetools create -t "${reg}:${VER}" -t "${reg}:latest" \
              "${reg}:${VER}-amd64" "${reg}:${VER}-arm64"
            docker buildx imagetools inspect "${reg}:${VER}"
          done
