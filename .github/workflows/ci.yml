name: CI
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    name: Product / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --frozen
      - run: make lint typecheck
      - name: Vendored Harness checks
        working-directory: vendor/octop-harness
        run: |
          uv run --project ../.. ruff check src tests
          uv run --project ../.. ruff format --check src tests
          uv run --project ../.. mypy src
          uv run --project ../.. pytest -c pyproject.toml tests/test_workspace_sync.py tests/test_memory_shutdown.py -q
      - name: Vendored Memory checks
        working-directory: vendor/octop-memory
        run: |
          uv run --project ../.. ruff check src tests
          uv run --project ../.. ruff format --check src tests
          uv run --project ../.. mypy src
      - run: make build-frontend
      - run: make test-product
      - name: Product frontend checks
        working-directory: dashboard
        run: |
          npx tsc -b
          npm run lint
          npm test -- src/api/product/client.test.ts src/pages/Product/ProductApp.test.tsx src/pages/Product/Workspace.test.tsx
      - run: make build-wheel
      - name: Install actual wheels into separate cloud and local environments
        run: |
          set -euo pipefail
          for role in cloud local-runtime; do
            uv venv ".verify/$role"
            if [[ "$RUNNER_OS" == Windows ]]; then
              py=".verify/$role/Scripts/python.exe"
            else
              py=".verify/$role/bin/python"
            fi
            uv pip install --python "$py" --find-links dist/product -r "dist/product/requirements-$role.txt"
            if [[ "$role" == local-runtime ]]; then
              uv pip install --python "$py" --no-deps dist/product/octop_harness-*.whl dist/product/octop_memory-*.whl
            fi
            uv pip install --python "$py" --no-deps dist/product/octop-*.whl
            mode="$role"
            [[ "$role" != local-runtime ]] || mode=local
            "$py" scripts/verify_product_install.py --role "$mode"
          done
  postgres:
    name: Product transactions / PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: octop_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: octop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U octop_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OCTOP_TEST_DATABASE_URL: postgresql://octop_test:test_only_password@localhost:5432/octop_test
      TEST_POSTGRES_DSN: postgresql://octop_test:test_only_password@localhost:5432/octop_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest tests/integration/test_cloud_identity.py tests/integration/test_platform_models.py tests/integration/test_platform_resources.py tests/integration/test_platform_sync.py tests/unit/db/test_application_migrations.py -q
      - name: Vendored Memory synchronization parity
        working-directory: vendor/octop-memory
        run: uv run --project ../.. pytest -c pyproject.toml tests/test_logical_sync.py -q
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/helm/octop
          helm template octop deploy/helm/octop >/dev/null
          helm template octop deploy/helm/octop -f deploy/helm/octop/values.example.yaml >/dev/null
          helm template octop deploy/helm/octop --set postgresql.enabled=false --set database.host=pg.example.com >/dev/null
          if helm template octop deploy/helm/octop --set replicaCount=2 >/dev/null 2>&1; then
            echo 'Concurrent cloud gateways are outside this release contract'; exit 1
          fi
  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - run: docker build -f deploy/docker/Dockerfile -t octop:test .
      - run: uv run --no-project --with pytest --with pytest-asyncio python -m pytest tests/integration/test_docker_image_boot.py -q --noconftest
